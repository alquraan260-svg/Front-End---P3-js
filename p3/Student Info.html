<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Info | StudentHub</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>
            <i class="bi bi-mortarboard-fill"></i>
            Student Hub
          </h1>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="Dashboard.html">
              <i class="bi bi-speedometer2"></i>
              Dashboard
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Courses.html">
              <i class="bi bi-book"></i>
              Courses
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Assignments.html">
              <i class="bi bi-journal-text"></i>
              Assignments
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              href="Student Info.html"
              aria-current="page"
            >
              <i class="bi bi-person"></i>
              Student Info
            </a>
          </li>
        </ul>
      </aside>

      <!-- Right Side -->
      <div class="content-wrapper">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg bg-white shadow-sm top-navbar">
          <div class="container-fluid justify-content-end">
            <!-- Notification Icon -->
            <button class="btn position-relative me-4" type="button">
              <i class="bi bi-bell fs-4"></i>
            </button>

            <!-- Student Profile -->
            <div class="dropdown">
              <button
                class="btn dropdown-toggle d-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle fs-2"></i>
                <span id="studentName"></span>
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="Student Info.html">
                    Student Info
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content container-fluid p-4">
          <!-- Page Header -->
          <header class="page-header">
            <div class="d-flex align-items-center gap-3">
              <i class="bi bi-person-circle icon-info fs-2"></i>

              <div>
                <h2>Student Information</h2>
                <p>View your personal and academic information.</p>
              </div>
            </div>
          </header>

          <!-- Student Info Content -->
          <section class="student-profile-section">
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <div class="row g-4 align-items-center">
                  <!-- Student Profile -->
                  <div class="col-12 col-md-4 text-center profile-divider">
                    <i
                      class="bi bi-person-circle icon-profile profile-icon"
                    ></i>

                    <h4 class="mt-3" id="profileStudentName"></h4>
                  </div>

                  <!-- Personal Information -->
                  <div class="col-12 col-md-8">
                    <div
                      class="d-flex justify-content-between align-items-center mb-4"
                    >
                      <h5 class="mb-0">Personal Information</h5>
                    </div>

                    <!-- Student Information Fields -->
                    <div id="studentView">
                      <div
                        class="mb-3 pb-2 border-bottom d-flex align-items-center gap-3"
                      >
                        <i class="bi bi-person student-detail-icon"></i>
                        
                          <h6 class="mb-0">Full Name</h6>
                          <p id="fullName"></p>
                        
                      </div>

                      <div
                        class="mb-3 pb-2 border-bottom d-flex align-items-center gap-3"
                      >
                        <i class="bi bi-calendar student-detail-icon"></i>
                        
                          <h6 class="mb-0">Date of Birth</h6>
                          <p id="dateOfBirth"></p>
                        
                      </div>

                      <div
                        class="mb-3 pb-2 border-bottom d-flex align-items-center gap-3"
                      >
                        <i class="bi bi-geo-alt student-detail-icon"></i>
                        <h6 class="mb-0">Major</h6>
                        <p id="major"></p>
                      </div>

                      <div
                        class="mb-3 pb-2 border-bottom d-flex align-items-center gap-3"
                      >
                        <i class="bi bi-flag student-detail-icon"></i>
                        <h6 class="mb-0">Nationality</h6>
                        <p id="nationality"></p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
      <!-- End content-wrapper -->
    </div>
    <!-- End app -->

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sharedCore.js"></script>
    <script src="student.js"></script>
  </body>
</html>
