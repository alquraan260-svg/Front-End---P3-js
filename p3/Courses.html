<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Student Dashboard</title>
  <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
</head>
<body>
    <div class="app">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm top-navbar">
      <div class="container-fluid justify-content-end">
        <!-- Notification Icon -->
        <button class="btn position-relative me-4" type="button">
          <i class="bi bi-bell fs-4"></i>
        </button>

        <!-- Student Profile -->
        <div class="dropdown">
          <button
            class="btn dropdown-toggle d-flex align-items-center gap-2"
            type="button"
            data-bs-toggle="dropdown"
          >
            <i class="bi bi-person-circle fs-2 text-primary"></i>

            <span id="studentName">Student</span>
          </button>

          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" href="Student Info.html">
                Student Info
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-icon"><i class="bi bi-mortarboard-fill"></i></span>
        <span class="brand-name">StudentHub</span>
      </div>
       <nav class="nav" aria-label="Main navigation">
        <a href="Dashboard.html" class="nav-link" data-page="dashboard"><span><i class="bi bi-bar-chart-line-fill"></i></span> Dashboard</a>
        <a href="courses.html" class="nav-link" data-page="courses"><span><i class="bi bi-book"></i></span> Courses</a>
        <a href="Assignments.html" class="nav-link" data-page="assignments"><span><i class="bi bi-list-task"></i></span> Assignments</a>
        <a href="Student Info.html" class="nav-link" data-page="student"><span><i class="bi bi-person"></i></span> Student Info</a>
      </nav>
    </aside>
        

  <main class="main-content">
        <section class="page" id="page-courses">
          <div class="toolbar">
            <input type="search" id="courseSearch" placeholder="Search courses, instructors…" aria-label="Search courses" />
            <select id="courseFilter" aria-label="Filter by status">
              <option value="all">All</option>
              <option value="Completed">Completed</option>
              <option value="In Progress">In Progress</option>
              <option value="Dropped">Dropped</option>
            </select>
            <button class="btn btn-primary" id="addCourseBtn" type="button">+ Add Course</button>
          </div>
          <div class="card table-card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Course</th><th>Credits</th><th>Start</th><th>End</th>
                    <th>Instructor</th><th>Classroom</th><th>Status</th><th>Actions</th>
                  </tr>
                </thead>
                <tbody id="courseTable"></tbody>
              </table>
            </div>
            <p class="empty" id="courseEmpty"></p>
          </div>
        </section>


  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>      
  <script src="courses.js"></script>
  </div>
</body>
</html>
