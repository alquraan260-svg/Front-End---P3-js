<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Courses | StudentHub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>
            <i class="bi bi-mortarboard-fill"></i>
            Student Hub
          </h1>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="Dashboard.html">
              <i class="bi bi-speedometer2"></i>
              Dashboard
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="Courses.html" aria-current="page">
              <i class="bi bi-book"></i>
              Courses
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Assignments.html">
              <i class="bi bi-journal-text"></i>
              Assignments
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Student Info.html">
              <i class="bi bi-person"></i>
              Student Info
            </a>
          </li>
        </ul>
      </aside>

      <!-- Right Side -->
      <div class="content-wrapper">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg bg-white shadow-sm top-navbar">
          <div class="container-fluid justify-content-end">
            <button class="btn position-relative me-4" type="button">
              <i class="bi bi-bell fs-4"></i>
            </button>

            <div class="dropdown">
              <button
                class="btn dropdown-toggle d-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle fs-2 text-primary"></i>
                <span id="studentName">Student</span>
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="Student Info.html">
                    Student Info
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>

        <main class="main-content">
          <section class="page" id="page-courses">
            <div class="toolbar">
              <input
                type="search"
                id="courseSearch"
                placeholder="Search courses, instructors…"
                aria-label="Search courses"
              />

              <select id="courseFilter" aria-label="Filter by status">
                <option value="all">All</option>
                <option value="Completed">Completed</option>
                <option value="In Progress">In Progress</option>
                <option value="Dropped">Dropped</option>
              </select>

              <button class="btn btn-primary" id="addCourseBtn" type="button">
                + Add Course
              </button>
            </div>

            <div class="card table-card">
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Course</th>
                      <th>Credits</th>
                      <th>Start</th>
                      <th>End</th>
                      <th>Instructor</th>
                      <th>Classroom</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>

                  <tbody id="courseTable"></tbody>
                </table>
              </div>

              <p class="empty" id="courseEmpty"></p>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sharedCore.js"></script>
    <script src="courses.js"></script>
  </body>
</html>
