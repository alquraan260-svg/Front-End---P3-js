<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>
            <i class="bi bi-mortarboard-fill"></i>
            Student Hub
          </h1>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a
              class="nav-link active"
              href="Dashboard.html"
              aria-current="page"
            >
              <i class="bi bi-speedometer2"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Courses.html">
              <i class="bi bi-book"></i> Courses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Assignments.html">
              <i class="bi bi-journal-text"></i> Assignments
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="Grades.html">
              <i class="bi bi-bar-chart-line"></i> Grades
            </a>
          </li>
        </ul>
      </aside>
      <div class="content-wrapper">
        <nav class="navbar navbar-expand-lg bg-white shadow-sm top-navbar">
          <div class="container-fluid justify-content-end">
            <button class="btn position-relative me-4" type="button">
              <i class="bi bi-bell fs-4"></i>
            </button>

            <div class="dropdown">
              <button
                class="btn dropdown-toggle d-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle fs-2 text-primary"></i>

                <span id="studentName">Student</span>
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="Student Info.html">
                    Student Info
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>

        <main class="main-content">
          <section class="page" id="page-dashboard">
            <p class="greeting" id="greeting"></p>

            <div class="stats-grid">
              <div class="stat-card stat-total">
                <div class="stat-label">Total Courses</div>
                <div class="stat-value" id="statTotal">0</div>
              </div>
              <div class="stat-card stat-completed">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="statCompleted">0</div>
              </div>
              <div class="stat-card stat-progress">
                <div class="stat-label">In Progress</div>
                <div class="stat-value" id="statProgress">0</div>
              </div>
              <div class="stat-card stat-dropped">
                <div class="stat-label">Dropped</div>
                <div class="stat-value" id="statDropped">0</div>
              </div>
            </div>

            <div class="grid-2">
              <div class="card">
                <h2>Course Progress</h2>
                <div class="progress-row">
                  <span>Completion rate</span
                  ><strong id="completionPct">0%</strong>
                </div>
                <div class="progress">
                  <div class="progress-fill" id="completionBar"></div>
                </div>
                <div class="mini-stats">
                  <div>
                    <span class="muted">Credit hours (completed)</span
                    ><strong id="creditsDone">0</strong>
                  </div>
                  <div>
                    <span class="muted">Credit hours (in progress)</span
                    ><strong id="creditsActive">0</strong>
                  </div>
                  <div>
                    <span class="muted">Assignments done</span
                    ><strong id="assignDone">0 / 0</strong>
                  </div>
                </div>
              </div>

              <div class="card">
                <h2>Upcoming Assignments</h2>
                <ul class="upcoming-list" id="upcomingList"></ul>
              </div>
            </div>
          </section>
        </main>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
      <script src="sharedCore.js"></script>
      <script src="dashboard.js"></script>
    </div>
  </body>
</html>
