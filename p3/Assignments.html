<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Assignments | StudentHub</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>
            <i class="bi bi-mortarboard-fill"></i>
            Student Hub
          </h1>
        </div>

        <ul class="nav flex-column">
          <li class="nav-item">
            <a class="nav-link" href="Dashboard.html">
              <i class="bi bi-speedometer2"></i>
              Dashboard
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Courses.html">
              <i class="bi bi-book"></i>
              Courses
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link active"
              href="Assignments.html"
              aria-current="page"
            >
              <i class="bi bi-journal-text"></i>
              Assignments
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="Student Info.html">
              <i class="bi bi-person"></i>
              Student Info
            </a>
          </li>
        </ul>
      </aside>
      <!-- Top Navbar -->
      <div class="content-wrapper">
        <nav class="navbar navbar-expand-lg bg-white shadow-sm top-navbar">
          <div class="container-fluid justify-content-end">
            <!-- Notification Icon -->
            <button class="btn position-relative me-4" type="button">
              <i class="bi bi-bell fs-4"></i>
            </button>

            <!-- Student Profile -->
            <div class="dropdown">
              <button
                class="btn dropdown-toggle d-flex align-items-center gap-2"
                type="button"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-person-circle fs-2"></i>

                <span id="studentName">Student</span>
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="Student Info.html">
                    Student Info
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>

        <main class="main-content container-fluid p-4">
          <header class="page-header">
            <div class="d-flex align-items-center gap-3">
              <i class="bi bi-clipboard-check fs-2"></i>
              <div>
                <h2>Assignments</h2>
                <p>Manage your assignments, due dates, and progress.</p>
              </div>
            </div>
          </header>

          <!-- Statistics Cards -->
          <section class="statistics-section mb-4">
            <div class="row g-4">
              <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-journal-text fs-1 mb-2 text-primary"></i>
                    <div>
                      <h5 class="card-title">To Do</h5>
                      <p class="card-text fs-3" id="ToDo">0</p>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-check-circle fs-1 mb-2 text-success"></i>

                    <div>
                      <h5 class="card-title">Done</h5>
                      <p class="card-text fs-3" id="Done">0</p>
                    </div>
                  </div>
                </div>
              </div>

              <div class="col-12 col-md-4">
                <div class="card shadow-sm">
                  <div class="card-body d-flex align-items-center gap-3">
                    <i class="bi bi-hourglass-split fs-1 mb-2 text-warning"></i>
                    <div>
                      <h5 class="card-title">Doing</h5>
                      <p class="card-text fs-3" id="Doing">0</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
          <!-- Assignments Management Section (Assignment Form + List)-->
          <section class="assignments-section">
            <div class="row g-4">
              <!-- Assignment Form -->
              <div class="col-12 col-lg-4">
                <div class="card shadow-sm">
                  <div class="card-body">
                    <h5 class="card-title mb-4">
                      <i class="bi bi-plus-circle me-2"></i>
                      Add New Assignment
                    </h5>
                    <form id="assignmentForm">
                      <div class="mb-3">
                        <label for="assignmentTitle" class="form-label"
                          >Assignment Title</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="assignmentTitle"
                          placeholder="Enter assignment title"
                          required
                        />
                      </div>

                      <div class="mb-3">
                        <label for="assignmentCourse" class="form-label"
                          >Course</label
                        >
                        <select
                          class="form-select"
                          id="assignmentCourse"
                          required
                        >
                          <option value="" disabled selected>
                            Select course
                          </option>
                        </select>
                      </div>

                      <div class="mb-3">
                        <label for="assignmentDueDate" class="form-label"
                          >Deadline</label
                        >
                        <input
                          type="date"
                          class="form-control"
                          id="assignmentDueDate"
                          required
                        />
                      </div>

                      <div class="mb-3">
                        <label for="assignmentStatus" class="form-label"
                          >Assignment Status</label
                        >
                        <select
                          class="form-select"
                          id="assignmentStatus"
                          required
                        >
                          <option value="To Do" selected>To Do</option>
                          <option value="Doing">Doing</option>
                          <option value="Done">Done</option>
                        </select>
                      </div>

                      <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-plus-circle me-2"></i>
                        Add Assignment
                      </button>
                    </form>
                  </div>
                </div>
              </div>

              <!-- Assignment List -->
              <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                  <div class="card-body">
                    <h5 class="card-title mb-4">
                      <i class="bi bi-list assignment-list-icon me-2"></i>
                      Assignment List
                    </h5>
                    <div class="table-responsive">
                      <table class="table table-hover align-middle">
                        <thead>
                          <tr>
                            <th>#</th>
                            <th>Course</th>
                            <th>Assignment Title</th>
                            <th>Deadline</th>
                            <th>Status</th>
                            <th>Actions</th>
                          </tr>
                        </thead>
                        <tbody id="assignmentTableBody"></tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="sharedCore.js"></script>

    <!-- Assignments JavaScript -->
    <script src="assignments.js"></script>
  </body>
</html>
